<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Whitechain Coffee — Demo Store</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #0a0a0a; color: #ededed; font-family: system-ui, sans-serif; }
    .card { background: #111; border: 1px solid #2a2a2a; border-radius: 16px; padding: 2rem; width: 360px; }
    .tag { font-size: .72rem; color: #3b82f6; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { font-size: 1.4rem; margin: .4rem 0 0; }
    .product { display: flex; gap: 1rem; align-items: center; margin: 1.5rem 0; }
    .thumb { width: 64px; height: 64px; border-radius: 12px; background: linear-gradient(135deg,#3b82f6,#8b5cf6); display:flex; align-items:center; justify-content:center; font-size:1.8rem; }
    .price { margin-left: auto; font-weight: 700; font-size: 1.2rem; }
    button { width: 100%; padding: .8rem; border: 0; border-radius: 10px; background: #3b82f6; color: #fff;
             font-weight: 700; font-size: 1rem; cursor: pointer; }
    button:hover { background: #2563eb; }
    input { width: 100%; box-sizing: border-box; margin-top: 1rem; padding: .55rem .7rem; border-radius: 8px;
            border: 1px solid #2a2a2a; background: #1a1a1a; color: #ededed; font-size: .8rem; }
    label { font-size: .72rem; color: #71717a; }
    #status { font-size: .8rem; color: #71717a; margin-top: .75rem; min-height: 1rem; }
    .note { font-size: .72rem; color: #71717a; margin-top: 1rem; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <span class="tag">Powered by FacePay · USDT on Whitechain</span>
    <h1>Whitechain Coffee</h1>
    <div class="product">
      <div class="thumb">☕</div>
      <div>
        <div style="font-weight:600">Single Origin Latte</div>
        <div style="font-size:.78rem;color:#71717a">Pay in USDT · settles on Whitechain</div>
      </div>
      <div class="price">2.00 USDT</div>
    </div>
    <button id="buy">Checkout</button>
    <div id="status"></div>

    <label for="apikey">Merchant API key (from the dashboard)</label>
    <input id="apikey" placeholder="sk_…" />
    <p class="note">This separate store integrates FacePay in ~20 lines (see <code>store.js</code>).
      Clicking Checkout creates an invoice via the SDK and redirects to the hosted USDT checkout.</p>
  </div>
  <script type="module" src="./store.js"></script>
</body>
</html>
